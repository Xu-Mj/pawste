name: Release

# 推送 v* tag（如 v1.0.0）时：构建 Release、打包、创建 GitHub Release 并附带 zip
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v1.0.0）"
        required: true

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  release:
    name: Build & Release (macOS 26 · Xcode 26)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # Release 构建 + 全程关闭签名（无开发者证书）
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pawste.xcodeproj \
            -scheme Pawste \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # 整包 ad-hoc 签名（关键，不能省）
      # CODE_SIGNING_ALLOWED=NO 的产物只有链接器给 arm64 可执行文件打的 "linker-signed" 签名：
      # 签名 identifier 是 "Pawste" 而不是 bundle ID、不绑定 Info.plist、x86_64 切片干脆没签名。
      # 系统 TCC 按 bundle ID 记录"辅助功能"授权，运行时却认不出这个进程 →
      # 设置里开关明明开着，App 仍然拿不到权限。codesign --sign - 补一个正规的整包 ad-hoc 签名
      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - build/Build/Products/Release/Pawste.app
          codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/Pawste.app
          codesign -dv build/Build/Products/Release/Pawste.app 2>&1 | grep -E "Identifier|Signature|CDHash"

      # ditto 保留 .app 包结构；产物名带版本号
      - name: Package app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent Pawste.app Pawste-${{ github.ref_name }}.zip
          shasum -a 256 Pawste-${{ github.ref_name }}.zip > Pawste-${{ github.ref_name }}.zip.sha256
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Build/Products/Release/Pawste-${{ github.ref_name }}.zip
            build/Build/Products/Release/Pawste-${{ github.ref_name }}.zip.sha256
          draft: false
          generate_release_notes: true
          body: |
            ## Pawste ${{ github.ref_name }}

            Spotlight 风的 macOS 剪贴板管理器 🐾

            ### 系统要求
            - **macOS 26 (Tahoe) 或更高** —— 用了 Liquid Glass 等新 API，低版本无法运行

            ### 安装
            1. 下载下方 `Pawste-${{ github.ref_name }}.zip` 并解压
            2. 把 `Pawste.app` 拖进 `/Applications`
            3. **首次打开**：这是未签名 / 未公证版本，Gatekeeper 会拦。两种方式之一打开：
               - 右键 `Pawste.app` → 打开 → 在弹窗里再点「打开」
               - 或终端执行：`xattr -cr /Applications/Pawste.app`
            4. 首次按 `Enter` 粘贴时，到 系统设置 → 隐私与安全性 → 辅助功能 里勾选 Pawste
               - **从旧版本升级**：旧授权对新版本无效（开关仍显示开启）。先在列表里 **−** 移除 Pawste 再重新添加，或执行 `tccutil reset Accessibility com.xumj.pawste` 后重新授权

            > ⚠️ 此构建未经 Apple 签名公证，仅供尝鲜。介意安全提示可自行从源码构建。

            ### 校验
            `Pawste-${{ github.ref_name }}.zip.sha256` 为 SHA-256 校验值。
